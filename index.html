<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FChain Wallet</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a1f44;
  color:white;
  text-align:center;
}

/* Screens */
.screen{display:none;padding:20px;}
#loginScreen{display:block;}
button{padding:12px;margin:5px;border:none;border-radius:6px;background:#1e90ff;color:white;font-size:16px;}

/* Top menu */
.topMenu{display:flex;justify-content:space-around;background:#111;padding:10px;}
.topMenu div{cursor:pointer;font-size:14px;}
.hidden{display:none;}

/* Dev Tools */
#devTools{background:black;padding:10px;border:2px solid #1e90ff;display:none;}
input{padding:5px;margin:3px;width:200px;}
</style>

</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="screen">
  <h2>Login to FChain</h2>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>


<!-- WALLET SCREEN -->
<div id="walletScreen" class="screen">

<h2 id="walletTitle">🚨 EDUCATIONAL SIMULATION – NOT A REAL WALLET</h2>

<h1 id="usdDisplay">$12450.32</h1>
<p>BTC: <span id="btcDisplay">0.134532</span></p>
<p>ETH: <span id="ethDisplay">2.43211</span></p>

<div class="topMenu">
  <div onclick="openPage('buy')">Buy</div>
  <div onclick="openPage('sell')">Sell</div>
  <div onclick="openPage('receive')">Receive</div>
</div>

<button onclick="goBack()">⬅ Back</button>
<button onclick="showLogin()">Logout</button>

</div>


<!-- BUY PAGE -->
<div id="buy" class="screen">
<h2>Buy Crypto</h2>
<button onclick="openPage('btcBuy')">Bitcoin</button>
<button onclick="openPage('ethBuy')">Ethereum</button>
<button onclick="goBack()">⬅ Back</button>
</div>

<div id="btcBuy" class="screen">
<h3>Buy Bitcoin</h3>
<button onclick="goBack()">⬅ Back</button>
</div>

<div id="ethBuy" class="screen">
<h3>Buy Ethereum</h3>
<button onclick="goBack()">⬅ Back</button>
</div>


<!-- SELL PAGE -->
<div id="sell" class="screen">
<h2>Sell Crypto</h2>
<button onclick="goBack()">⬅ Back</button>
</div>

<!-- RECEIVE PAGE -->
<div id="receive" class="screen">
<h2>Receive Crypto</h2>
<p>Your Address:</p>
<p>0xFAKE123456789ABCDE</p>
<button onclick="goBack()">⬅ Back</button>
</div>


<!-- DEV TOOLS -->
<div id="devTools">
<h3>Dev Tools</h3>

Email: <input id="devEmail" value="joeledward949@gmail.com"><br>
Password: <input id="devPass" value="123456"><br>
BTC Balance: <input id="btcBal" value="0.134532"><br>
ETH Balance: <input id="ethBal" value="2.43211"><br>
USD Balance: <input id="usdBal" value="12450.32"><br>

<button onclick="applyDev()">Apply</button>
</div>


<script>

/* LOGIN SYSTEM */
function login(){
  let e = document.getElementById("email").value;
  let p = document.getElementById("password").value;
  if(!e || !p){alert("Enter login details");return;}
  showWallet();
}

function showWallet(){
  hideAll();
  document.getElementById("walletScreen").style.display="block";
  historyStack = ["walletScreen"];
}

function showLogin(){
  hideAll();
  document.getElementById("loginScreen").style.display="block";
  historyStack=[];
}

/* NAVIGATION STACK */
let historyStack = [];

function hideAll(){
  document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
}

function openPage(id){
  hideAll();
  document.getElementById(id).style.display="block";
  historyStack.push(id);
}

function goBack(){
  if(historyStack.length > 1){
    historyStack.pop();
    hideAll();
    document.getElementById(historyStack[historyStack.length-1]).style.display="block";
  }
}

/* DEV TOOLS APPLY */
function applyDev(){
  document.getElementById("btcDisplay").innerText = document.getElementById("btcBal").value;
  document.getElementById("ethDisplay").innerText = document.getElementById("ethBal").value;
  document.getElementById("usdDisplay").innerText = "$" + document.getElementById("usdBal").value;
  alert("Updated!");
}

/* CLICK TITLE 5 TIMES TO SHOW DEVTOOLS */
let tap = 0;
document.getElementById("walletTitle").onclick = ()=>{
  tap++;
  if(tap>=5){
    document.getElementById("devTools").style.display="block";
    tap=0;
  }
};

</script>

</body>
  </html>
