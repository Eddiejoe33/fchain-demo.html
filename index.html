<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FChain Wallet</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
.page{display:none;padding:15px;}
.active{display:block;}
h2{text-align:center;}
.btn{width:100%;padding:14px;background:#2563eb;border:none;border-radius:10px;color:white;font-size:16px;margin-top:10px;cursor:pointer;}
.card{background:#111827;padding:12px;border-radius:12px;margin-top:10px;}
input{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;}
.progress{width:100%;background:#1e293b;border-radius:10px;overflow:hidden;}
.bar{height:12px;background:#22c55e;width:0%;}
.banner{background:red;padding:6px;font-size:12px;text-align:center;}

/* Bottom Nav */
.bottom-nav{
position:fixed;bottom:0;width:100%;display:flex;
background:#020617;border-top:1px solid #1e293b;height:65px;z-index:999;
}
.nav-btn{flex:1;text-align:center;padding-top:6px;font-size:11px;color:#94a3b8;cursor:pointer;}
.nav-btn span{font-size:22px;display:block;}
.hidden-nav{display:none;}

/* DevTools */
#devTools{
position:fixed;top:10px;left:10px;background:#111827;
padding:10px;border-radius:10px;border:1px solid #22c55e;
display:none;z-index:9999;
}
#devTools input{width:100%;padding:6px;margin:4px 0;border-radius:5px;border:none;}
</style>
</head>

<body>

<div class="banner">🚨 EDUCATIONAL SIMULATION – NOT A REAL WALLET</div>

<!-- DEVTOOLS -->
<div id="devTools">
<h3>Dev Tools</h3>
BTC <input id="devBTC"><br>
ETH <input id="devETH"><br>
USD <input id="devUSD"><br>
<button class="btn" onclick="saveDev()">Save</button>
</div>

<!-- WELCOME -->
<div id="welcome" class="page active">
<h2 id="tapLogo">Welcome to FChain Wallet</h2>
<button class="btn" onclick="openPage('register')">Create Wallet</button>
<button class="btn" onclick="openPage('login')">Login</button>
</div>

<!-- REGISTER -->
<div id="register" class="page">
<button class="btn" onclick="goBack()">⬅ Back</button>
<input id="regEmail" placeholder="Email">
<input id="regPass" type="password" placeholder="Password">
<input id="regPass2" type="password" placeholder="Confirm">
<button class="btn" onclick="registerUser()">Create</button>
</div>

<!-- LOGIN -->
<div id="login" class="page">
<button class="btn" onclick="goBack()">⬅ Back</button>
<input id="loginEmail" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">
<button class="btn" onclick="loginUser()">Login</button>
</div>

<!-- CREATING -->
<div id="creating" class="page">
<h2>Creating Wallet...</h2>
<div class="progress"><div id="bar" class="bar"></div></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page">
<h2 id="dashTap">FChain Wallet</h2>

<div style="display:flex;gap:6px;">
<button class="btn" onclick="openPage('buy')">Buy</button>
<button class="btn" onclick="openPage('sell')">Sell</button>
<button class="btn" onclick="openPage('receive')">Receive</button>
</div>

<h1 id="usd">$12,450</h1>
<div class="card" id="btc">BTC: 0.13</div>
<div class="card" id="eth">ETH: 2.43</div>
</div>

<!-- BUY -->
<div id="buy" class="page">
<button class="btn" onclick="goBack()">⬅ Back</button>
<div class="card" onclick="alert('Network busy')">Buy BTC</div>
<div class="card" onclick="alert('Network busy')">Buy ETH</div>
</div>

<!-- SELL -->
<div id="sell" class="page">
<button class="btn" onclick="goBack()">⬅ Back</button>
<div class="card" onclick="alert('Liquidity error')">Sell BTC</div>
<div class="card" onclick="alert('Liquidity error')">Sell ETH</div>
</div>

<!-- RECEIVE -->
<div id="receive" class="page">
<button class="btn" onclick="goBack()">⬅ Back</button>
<div class="card">BTC Address: bc1qf99...urf</div>
<div class="card">ETH Address: 0xE6A4...189</div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav hidden-nav" id="nav">
<div class="nav-btn" onclick="openPage('dashboard')"><span>🏠</span>Home</div>
<div class="nav-btn" onclick="openPage('buy')"><span>💳</span>Buy</div>
<div class="nav-btn" onclick="openPage('sell')"><span>💱</span>Sell</div>
<div class="nav-btn" onclick="openPage('receive')"><span>📥</span>Receive</div>
</div>

<script>
// PAGE SYSTEM
let history=["welcome"];
let appPages=["dashboard","buy","sell","receive"];

function openPage(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");

if(history[history.length-1]!==id) history.push(id);

document.getElementById("nav").classList.toggle("hidden-nav", !appPages.includes(id));
}

function goBack(){
history.pop();
openPage(history.pop() || "welcome");
}

// REGISTER
function registerUser(){
if(regPass.value!==regPass2.value){alert("Password mismatch");return;}
localStorage.email=regEmail.value;
localStorage.pass=regPass.value;

openPage("creating");
let i=0;
let t=setInterval(()=>{
i+=5; bar.style.width=i+"%";
if(i>=100){clearInterval(t); openPage("dashboard");}
},80);
}

// LOGIN
function loginUser(){
if(loginEmail.value==localStorage.email && loginPass.value==localStorage.pass){
openPage("dashboard");
}else alert("Wrong login");
}

// DEVTOOLS TAP 5 TIMES
let tap=0,timer;
function tapDev(){
tap++;
clearTimeout(timer);
timer=setTimeout(()=>tap=0,1200);
if(tap>=5){
document.getElementById("devTools").style.display="block";
tap=0;
}
}
document.getElementById("tapLogo").onclick=tapDev;
document.getElementById("dashTap").onclick=tapDev;

// DEV SAVE
function saveDev(){
localStorage.btc=devBTC.value;
localStorage.eth=devETH.value;
localStorage.usd=devUSD.value;
btc.innerText="BTC: "+devBTC.value;
eth.innerText="ETH: "+devETH.value;
usd.innerText=devUSD.value;
alert("Saved");
}
</script>

</body>
                       </html>
